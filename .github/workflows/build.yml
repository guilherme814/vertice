name: Build Vértice Launcher

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O repositório não tem gradlew: o setup-gradle instala o Gradle pedido.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vertice-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Versão otimizada (R8) para medir o tamanho/peso real.
      - name: Build release APK
        continue-on-error: true
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertice-launcher-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
