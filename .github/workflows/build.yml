name: Build Vértice Launcher

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Confere se o gradle-wrapper.jar é um dos oficiais (proteção contra jar adulterado).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testes de JVM (lógica pura: layout da Home). Falhou = nada de APK.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vertice-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Versão otimizada (R8) para medir o tamanho/peso real.
      - name: Build release APK
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertice-launcher-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
